    snapshot: "crumbs/crumbs button/img; breadcrumbRow принадлежит внешней композиции"
  metric-css:
    kind: "document"
    uri: "references/implementation-current/features/metrics/detail/MetricDetail.module.css"
    status: "observed-snapshot"
