  contract: "specs/Общие компоненты/Базовые элементы/Хлебные крошки/Контракт.md"
  status: approved-target
sources:
  report-figma:
    kind: "figma"
    uri: "https://www.figma.com/design/lnOcWh4ElGkhppWe6Kn5AA?node-id=893-19328"
    nodeId: "893:19328"
    status: "unverified-live"
    snapshot: "Сохранённая панель паспорта отчёта; исходная строка20, поздняя круглая кнопка снаружи"
  metric-figma:
    kind: "figma"
    uri: "https://www.figma.com/design/lnOcWh4ElGkhppWe6Kn5AA?node-id=1172-28656"
    nodeId: "1172:28656"
    status: "unverified-live"
    snapshot: "Шапка паспорта метрики; исходные тексты подтверждены локальным figma-inventory"
  report-css:
    kind: "document"
    uri: "references/implementation-current/features/report-detail/Detail.module.css"
