    surface-gap: {type: dimension, value: 8, unit: px}
    surface-anchor: {type: string, value: field-left}
    surface-radius: {type: dimension, value: 12, unit: px}
    surface-background: {type: color, format: hex, value: "#FFFFFF"}
    surface-border-width: {type: dimension, value: 0, unit: px}
    surface-shadow-x: {type: dimension, value: 0, unit: px}
    surface-shadow-y: {type: dimension, value: 8, unit: px}
    surface-shadow-blur: {type: dimension, value: 24, unit: px}
    surface-shadow-spread: {type: dimension, value: 0, unit: px}
    surface-shadow-color: {type: color, format: srgb, value: {r: 0, g: 0, b: 0, a: 0.12}}
