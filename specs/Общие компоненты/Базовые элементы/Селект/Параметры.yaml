schemaVersion: 1
component:
  id: select
  title: Селект и строка выбора
  contract: "specs/Общие компоненты/Базовые элементы/Селект/Контракт.md"
  status: approved-target
sources:
  field-values:
    kind: figma
    uri: https://www.figma.com/design/lnOcWh4ElGkhppWe6Kn5AA?node-id=1310-38277
    nodeId: "1310:38277"
    status: unverified-live
    snapshot: Параметры поля из принятого локального среза 1–2 ноября; variable113:19 сохранена как происхождение resolved paint, актуальность живого узла не подтверждена
  list-values:
    kind: figma
    uri: https://www.figma.com/design/lnOcWh4ElGkhppWe6Kn5AA?node-id=1436-179840
    nodeId: "1436:179840"
    status: unverified-live
    snapshot: Список с поиском; источник параметров, ошибочная координата y420 не принимается
  current-application:
    kind: document
    uri: "specs/Общие компоненты/Фильтрация отчётов/Контракт.md"
    status: approved-decision
    snapshot: Действующие исключения и конфигурации полей после решений 3–4 ноября
  appearance-owner:
    kind: document
    uri: "context/target/Требования и границы.md"
    status: approved-decision
    snapshot: Общее появление popup от 4 ноября; механизм reduced-motion у этого владельца
  fonts:
    kind: document
    uri: "specs/Ресурсы/Шрифты/README.md"
    status: reference-only
    snapshot: Файлы CoFo Sans Regular/Medium предоставлены пользователем
  input-parameters:
    kind: document
    uri: "specs/Общие компоненты/Базовые элементы/Поле ввода/Параметры.yaml"
    status: approved-decision
    snapshot: П4-03 переносит внутренние параметры поиска к B02; внешняя область поиска остаётся B04
  choice-parameters:
    kind: document
    uri: "specs/Общие компоненты/Базовые элементы/Контрол выбора/Параметры.yaml"
    status: approved-decision
    snapshot: П4-04 переносит два размера checkbox к B06; строка и её текст/hover/selected остаются у B05
  sidebar-hover:
    kind: document
    uri: "references/implementation-current/components/Sidebar/Sidebar.module.css"
    status: approved-decision
    snapshot: Решение пользователя4ноября; светлый hover dropdown совпадает с фоном самой боковой панели, не активного пункта
  single-check:
    kind: figma
    uri: https://www.figma.com/design/XxVV0tHNlBa7jYks6pcuCq?node-id=2525-997
    nodeId: "2525:997"
    status: observed-snapshot
    snapshot: DS-03 05. System / 01. Check; live get_design_context4ноября, SVG24x24 без изменения байтов; происхождение prototype/src/components/DropdownItem/check-source.json
  standalone-select:
    kind: document
    uri: "references/implementation-current/components/SingleSelect/SingleSelect.tsx"
    status: approved-decision
    snapshot: Решение пользователя4ноября о едином hover и единственной галочке во всех селектах прототипа; установленный Radix Select без новых зависимостей
  multi-selection-tags:
    kind: document
    uri: "specs/Общие компоненты/Базовые элементы/Селект/Контракт.md"
    status: approved-decision
    snapshot: Решения пользователя 4–5 ноября о тегах multiple-полей, счётчике скрытых значений, списке переполнения и удалении. Локальная реализация MultiSelectTrigger
  select-clear-appearance:
    kind: document
    uri: "specs/Общие компоненты/Базовые элементы/Селект/Контракт.md"
    status: approved-decision
    snapshot: Уточнение 8 ноября о размере и цветах общей кнопки сброса внутри селекта
tokens:
  single-check-width:
    type: dimension
    sourceRef: single-check
    locator: width
  single-check-height:
    type: dimension
    sourceRef: single-check
    locator: height
  choice-size:
    type: dimension
    sourceRef: choice-parameters
    locator: variants.filter-checkbox16.parameters.visual-size
  choice-wrapper-height:
    type: dimension
    sourceRef: choice-parameters
    locator: variants.filter-checkbox16.parameters.wrapper-height
  input-height:
    type: dimension
    sourceRef: input-parameters
    locator: base.parameters.height
  input-font-size:
    type: dimension
    sourceRef: input-parameters
    locator: base.parameters.font-size
  input-line-height:
    type: dimension
    sourceRef: input-parameters
    locator: base.parameters.line-height
  input-font-weight:
    type: font-weight
    sourceRef: input-parameters
    locator: base.parameters.font-weight
  input-placeholder-color:
    type: color
    sourceRef: input-parameters
    locator: base.parameters.placeholder-color
  ui-font:
    type: font-family
    sourceRef: fonts
    locator: Эталонное семейство интерфейса из README шрифтов
  dropdown-hover:
    type: color
    sourceRef: sidebar-hover
    locator: "--sidebar-surface; фон боковой панели #F3F4F9"
  popup-duration-ms:
    type: integer
    sourceRef: appearance-owner
    locator: Появление выпадающих меню — duration в ms
  popup-easing:
    type: string
    sourceRef: appearance-owner
    locator: Появление выпадающих меню — easing
