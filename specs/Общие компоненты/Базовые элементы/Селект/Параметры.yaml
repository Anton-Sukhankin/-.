    search-line-height: {type: token, ref: input-line-height, expectedType: dimension}
    search-font-weight: {type: token, ref: input-font-weight, expectedType: font-weight}
    search-placeholder-color: {type: token, ref: input-placeholder-color, expectedType: color}
    max-visible-options: {type: integer, value: 7}
    option-height: {type: dimension, value: 36, unit: px}
    option-radius: {type: dimension, value: 8, unit: px}
    option-transition-duration-ms: {type: integer, value: 160}
