variants:
  panel-wide:
    description: Широкое поле общей панели и собственная поверхность списка
    sourceRefs: [field-values, current-application]
    parameters:
      field-width: {type: dimension, value: 440, unit: px}
      surface-width: {type: dimension, value: 440, unit: px}
  panel-narrow:
    description: Узкое поле; не определяет единственность выбора
    sourceRefs: [current-application]
    parameters:
      field-width: {type: dimension, value: 212, unit: px}
      surface-width: {type: dimension, value: 212, unit: px}
  panel-owner:
    description: Владелец — широкая поверхность при узком поле, расширение влево
    sourceRefs: [current-application]
    parameters:
      field-width: {type: dimension, value: 212, unit: px}
      surface-width: {type: dimension, value: 292, unit: px}
      surface-anchor: {type: string, value: field-right}
  panel-status:
    description: Единственный статус; native radio скрыт, у выбранной строки одна DS-галочка
    sourceRefs: [current-application, sidebar-hover, single-check]
    parameters:
      field-width: {type: dimension, value: 212, unit: px}
      surface-width: {type: dimension, value: 212, unit: px}
      option-selection-appearance: {type: string, value: single-check}
      option-indicator-width: {type: token, ref: single-check-width, expectedType: dimension}
      option-indicator-height: {type: token, ref: single-check-height, expectedType: dimension}
      option-radius: {type: dimension, value: 8, unit: px}
      option-padding-inline: {type: dimension, value: 8, unit: px}
      option-padding-block: {type: dimension, value: 0, unit: px}
      option-transition-duration-ms: {type: integer, value: 160}
    states:
      selected:
        sourceRefs: [current-application]
        parameters:
          option-color: {type: color, format: hex, value: "#0067DC"}
  embedded-list:
    description: Только внутренние значения/поиск; внешняя поверхность и trigger принадлежат меню колонки
    sourceRefs: [list-values, current-application]
    parameters:
      trigger-owner: {type: string, value: parent}
      surface-owner: {type: string, value: parent}
  single-choice-popup:
    description: Общий самостоятельный селект; ширина и применение принадлежат потребителю
    sourceRefs: [standalone-select, sidebar-hover, single-check]
    parameters:
      field-height: {type: dimension, value: 40, unit: px}
      field-min-width: {type: dimension, value: 140, unit: px}
      field-radius: {type: dimension, value: 10, unit: px}
      field-background: {type: color, format: hex, value: "#F3F4F9"}
      surface-padding-inline: {type: dimension, value: 8, unit: px}
      surface-padding-bottom: {type: dimension, value: 8, unit: px}
      option-selection-appearance: {type: string, value: single-check}
      option-indicator-width: {type: token, ref: single-check-width, expectedType: dimension}
      option-indicator-height: {type: token, ref: single-check-height, expectedType: dimension}
      option-content-gap: {type: dimension, value: 8, unit: px}
      option-padding-inline: {type: dimension, value: 8, unit: px}
      option-padding-block: {type: dimension, value: 6, unit: px}
      option-selected-color: {type: color, format: hex, value: "#0067DC"}
