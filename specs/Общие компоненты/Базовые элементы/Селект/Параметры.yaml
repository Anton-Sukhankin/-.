    label-font-size: {type: dimension, value: 12, unit: px}
    label-line-height: {type: dimension, value: 12, unit: px}
    label-font-weight: {type: font-weight, value: 400}
    label-color: {type: color, format: hex, value: "#202028"}
    field-height: {type: dimension, value: 40, unit: px}
    field-radius: {type: dimension, value: 10, unit: px}
    field-padding-inline: {type: dimension, value: 12, unit: px}
    field-content-gap: {type: dimension, value: 8, unit: px}
    field-border-width: {type: dimension, value: 1, unit: px}
    field-border-color: {type: color, format: hex, value: "#D7E6F5"}
    field-background: {type: color, format: hex, value: "#F3F4F9"}
    value-font-size: {type: dimension, value: 14, unit: px}
    value-line-height: {type: dimension, value: 14, unit: px}
    value-font-weight: {type: font-weight, value: 400}
    value-color: {type: color, format: srgb, value: {r: 0.12, g: 0.13, b: 0.15}}
    font-family: {type: token, ref: ui-font, expectedType: font-family}
