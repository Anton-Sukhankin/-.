    option-gap: {type: dimension, value: 4, unit: px}
    option-content-gap: {type: dimension, value: 10, unit: px}
    option-padding-inline: {type: dimension, value: 0, unit: px}
    option-padding-block: {type: dimension, value: 0, unit: px}
    option-font-size: {type: dimension, value: 14, unit: px}
    option-line-height: {type: dimension, value: 18, unit: px}
    option-font-weight: {type: font-weight, value: 500}
    option-color: {type: color, format: srgb, value: {r: 0.09, g: 0.14, b: 0.22}}
    option-selection-appearance: {type: string, value: checkbox}
    checkbox-size: {type: token, ref: choice-size, expectedType: dimension}
