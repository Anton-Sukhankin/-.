variants:
  mau:
    description: Пояснение справа и нижние пресеты; их значения/подписи передаёт C05
    sourceRefs:
      - current-application
      - chip-contract
      - implementation
    parameters:
      description-visible:
        type: boolean
        value: true
      presets-visible:
        type: boolean
        value: true
      presets-row-margin-top:
        type: dimension
        value: 8
        unit: px
      presets-gap:
        type: dimension
        value: 8
        unit: px
      last-row-padding-bottom:
        type: dimension
        value: 0
        unit: px
    states:
      invalid:
        sourceRefs:
          - flow
          - implementation
        parameters:
          error-color:
            type: color
            format: hex
            value: "#BA2018"
          field-error-inset-width:
            type: dimension
            value: 1
            unit: px
      focus-implementation:
        sourceRefs:
          - implementation
        parameters:
          field-outline-width:
            type: dimension
            value: 2
            unit: px
          field-outline-offset:
            type: dimension
            value: 1
            unit: px
          slider-outline-width:
            type: dimension
            value: 2
            unit: px
          slider-outline-offset:
            type: dimension
            value: 2
            unit: px
          outline-color:
            type: color
            format: hex
            value: "#007BFC"
  last-viewed:
    description: Без пояснения/пресетов; нижний резерв под выступающие ползунки
    sourceRefs:
      - current-application
      - implementation
    parameters:
      description-visible:
        type: boolean
        value: false
      presets-visible:
        type: boolean
        value: false
      last-row-padding-bottom:
        type: dimension
        value: 10
        unit: px
    states:
      invalid:
        sourceRefs:
          - flow
          - implementation
        parameters:
          error-color:
            type: color
            format: hex
            value: "#BA2018"
          field-error-inset-width:
            type: dimension
            value: 1
            unit: px
      focus-implementation:
