sources:
  search-geometry:
    kind: figma
    uri: https://www.figma.com/design/lnOcWh4ElGkhppWe6Kn5AA/Untitled?node-id=505-6609
    nodeId: 505:6609
    status: unverified-live
    snapshot: Срез C03 от2 ноября2026; экземпляры505:6610/505:6612, не повторное чтение живой Figma
  search-view:
    kind: document
    uri: specs/Общие компоненты/Поиск и навигатор/Вид.md
    status: observed-snapshot
    snapshot: Происхождение параметров поиска; при переносе внутренние параметры переданы B08, внешняя
      зона осталась C03
  search-css:
    kind: document
    uri: references/implementation/components/Search/CatalogSearch.module.css
    status: observed-snapshot
    snapshot: Прозрачный резерв рамки и focus текущего demo; не новая визуальная приёмка
  search-native:
    kind: document
    uri: references/implementation/components/Search/CatalogSearch.tsx
    status: observed-snapshot
    snapshot: Только тип Отчёты реализован как button aria-pressed; неизвестные комбинации не дополняются
  preset-enabled:
    kind: figma
    uri: https://www.figma.com/design/Hwq9fTAws3U2qjKK9mYZty?node-id=20223-17745
    nodeId: 20223:17745
    status: unverified-live
    snapshot: Основа XS item из C05/B07; без необязательных значков и tooltip
  preset-active:
    kind: figma
    uri: https://www.figma.com/design/Hwq9fTAws3U2qjKK9mYZty?node-id=20223-17764
    nodeId: 20223:17764
    status: unverified-live
    snapshot: Происхождение active; локальные цвета белой панели проверяются по существующему CSS
  preset-css:
    kind: document
    uri: references/implementation/components/ReportRangeField/ReportRangeField.module.css
    status: observed-snapshot
    snapshot: Текущие стили пресетов, active/hover/focus и reduced-motion; код не меняется
  preset-native:
    kind: document
    uri: references/implementation/components/ReportRangeField/ReportRangeField.tsx
    status: observed-snapshot
    snapshot: Активация и aria-pressed вычисленного пресета; пороги не принадлежат стилевому контракту
  table-hover:
    kind: document
    uri: specs/Общие компоненты/Таблица отчётов/Контракт.md
    status: approved-decision
    snapshot: Единственный владелец значения --table-heading-hover
  fonts:
    kind: document
    uri: specs/Ресурсы/Шрифты/README.md
    status: reference-only
    snapshot: Эталонное семейство CoFo Sans и предоставленные файлы
tokens:
  ui-font:
    type: font-family
    sourceRef: fonts
    locator: CoFo Sans; Medium соответствует weight500
  preset-hover:
