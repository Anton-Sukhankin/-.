    status: reference-only
    snapshot: "Пагинация списков · решение1ноября2026: N>pageSize, не viewport; освобождение
      специального резерва"
  table-figma:
    kind: figma
    uri: https://www.figma.com/design/lnOcWh4ElGkhppWe6Kn5AA?node-id=1026-21715
    nodeId: 1026:21715
    status: unverified-live
    snapshot: Демонстрация999 страниц/9990 записей, срез1–2ноября; не реальный total и не полный
      алгоритм многоточия
  home-figma:
    kind: figma
    uri: https://www.figma.com/design/lnOcWh4ElGkhppWe6Kn5AA?node-id=1030-21711
    nodeId: 1030:21711
    status: unverified-live
    snapshot: "Панель избранных карточек: высота64, верхние radius20, точный цвет Figma shadow"
  hidden-figma:
    kind: figma
    uri: https://www.figma.com/design/lnOcWh4ElGkhppWe6Kn5AA?node-id=1400-47075
    nodeId: 1400:47075
    status: unverified-live
    snapshot: "Применённый домен, одна страница: hidden, нижний резерв16 вместо80"
  table-owner:
    kind: document
    uri: specs/Общие компоненты/Таблица отчётов/Контракт.md
    status: reference-only
    snapshot: Внешняя композиция/непрокручиваемый footer и ограничения demo-total
  home-owner:
    kind: document
    uri: specs/Разделы/Главная/Виды.md
    status: reference-only
    snapshot: Локальные размещения и сохранённый дефект z-order вкладчиков; не общая норма
  pagination-css:
    kind: document
    uri: references/implementation/components/ListPagination/ListPagination.module.css
    status: observed-snapshot
    snapshot: Корпус/кнопки/selected/disabled/focus; точные текущие CSS-цвета
  pagination-code:
    kind: document
    uri: references/implementation/components/ListPagination/ListPagination.tsx
    status: observed-snapshot
    snapshot: ceil total/pageSize, null при<=1, все номера, zero-based intent и фактический диапазон
  source-flow-css:
    kind: document
    uri: references/implementation/features/sources/Sources.module.css
    status: observed-snapshot
    snapshot: pagination nav position:relative/width100%; внешний flow-wrapper принадлежит каталогу
      Источников
  fonts:
    kind: document
    uri: specs/Ресурсы/Шрифты/README.md
    status: reference-only
    snapshot: CoFo Sans; действующие файлы и начертания у общего ресурса
  glyph-left:
    kind: document
    uri: assets/images/report-table/chevron-left.svg
    status: reference-only
    snapshot: Полный SVG16×16; непрозрачность границы задаёт disabled кнопки
  glyph-right:
    kind: document
    uri: assets/images/report-table/chevron-right.svg
    status: reference-only
    snapshot: Полный SVG16×16; не иконка сворачивания меню
