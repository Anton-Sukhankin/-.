schemaVersion: 1
component:
  id: selection-control
  title: Чекбокс и одиночный выбор — подтверждённые применения
  contract: specs/Общие компоненты/Базовые элементы/Контрол выбора/Контракт.md
  status: approved-target
sources:
  list-source:
    kind: figma
    uri: https://www.figma.com/design/lnOcWh4ElGkhppWe6Kn5AA?node-id=1436-179840
    nodeId: 1436:179840
    status: unverified-live
    snapshot: Срез02.11 списка; размер квадрата/обёртки перенесён из принятого B04, не все состояния DS
  list-implementation:
    kind: document
    uri: references/implementation/components/FilterValueList/FilterValueList.module.css
    status: observed-snapshot
    snapshot: Совмещение native input, unchecked и технический focus — наблюдение существующей реализации
  checked-svg:
    kind: asset
    uri: assets/images/column-filter/checkbox-checked.svg
    status: observed-snapshot
    snapshot: Существующий ресурс intrinsic/viewBox16x20; plate16x16 с y2 и точным цветом007BFB; не
      перекрашивать и не обрезать
  form-source:
    kind: figma
    uri: https://www.figma.com/design/lnOcWh4ElGkhppWe6Kn5AA?node-id=1116-28132
    nodeId: 1116:28132
    status: unverified-live
    snapshot: Четыре unchecked-флага Последнего значения на кадре1440x1180, не проверка отправки
  form-implementation:
    kind: document
    uri: references/implementation/features/report-detail/mailings/MailingsTab.module.css
    status: observed-snapshot
    snapshot: Размеры/цвета и подача checked background16x16 наблюдены в CSS; новая визуальная приёмка
      не заявлена
  status-decision:
    kind: document
    uri: specs/Общие компоненты/Фильтрация отчётов/Контракт.md
    status: approved-decision
    snapshot: Статус — одиночный выбор без видимого radio; значения/смысл Все и DRAFT принадлежат C05
  native-implementation:
    kind: document
    uri: references/implementation/components/FilterValueList/FilterValueList.tsx
    status: observed-snapshot
    snapshot: Native checkbox/radio, группа по useId и отдельный декоративный mark; без назначения
      обязательного API
base:
  sourceRefs:
    - native-implementation
    - status-decision
  parameters:
    native-control-required:
      type: boolean
      value: true
    state-owner:
      type: string
      value: parent
