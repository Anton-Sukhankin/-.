    type: dimension
    sourceRef: counter-parameters
    locator: variants.navigation-text14.parameters.line-height
  nav-counter-font-weight:
    type: font-weight
    sourceRef: counter-parameters
    locator: variants.navigation-text14.parameters.font-weight
  nav-counter-color:
