base:
  sourceRefs: [item-family, panel-decision, fonts, anchor-evidence]
  parameters:
    row-height: {type: dimension, value: 36, unit: px}
    row-outer-inset-inline: {type: dimension, value: 8, unit: px}
    item-padding-inline: {type: dimension, value: 12, unit: px}
    glyph-size: {type: dimension, value: 20, unit: px}
    glyph-page-x: {type: dimension, value: 20, unit: px}
    label-page-x: {type: dimension, value: 48, unit: px}
    glyph-label-gap: {type: dimension, value: 8, unit: px}
    text-area-width: {type: dimension, value: 212, unit: px}
    label-counter-gap: {type: dimension, value: 12, unit: px}
    font-family: {type: token, ref: ui-font, expectedType: font-family}
    label-font-size: {type: dimension, value: 14, unit: px}
    label-line-height: {type: dimension, value: 20, unit: px}
    label-font-weight: {type: font-weight, value: 500}
    label-color: {type: color, format: hex, value: "#343A4A"}
    counter-font-size: {type: token, ref: nav-counter-font-size, expectedType: dimension}
    counter-line-height: {type: token, ref: nav-counter-line-height, expectedType: dimension}
    counter-font-weight: {type: token, ref: nav-counter-font-weight, expectedType: font-weight}
    counter-color: {type: token, ref: nav-counter-color, expectedType: color}
    glyph-color: {type: color, format: hex, value: "#101D3B"}
    background: {type: color, format: srgb, value: {r: 0, g: 0, b: 0, a: 0}}
    hover-duration-ms: {type: integer, value: 160}
    text-close-duration-ms: {type: integer, value: 100}
    text-open-duration-ms: {type: integer, value: 160}
    text-open-delay-ms: {type: integer, value: 80}
    same-svg-across-modes: {type: boolean, value: true}
    keep-text-in-dom: {type: boolean, value: true}
variants:
  expanded:
    description: Подписанный пункт; высота и постоянная сетка наследуются из base
    sourceRefs: [item-family, panel-decision]
    parameters:
      item-radius: {type: dimension, value: 4, unit: px}
      item-padding-block: {type: dimension, value: 8, unit: px}
      text-visible: {type: boolean, value: true}
    states:
      selected:
        sourceRefs: [selected]
        parameters:
          background: {type: color, format: hex, value: "#E2E6EC"}
      hover:
        sourceRefs: [hover-decision, implementation]
        parameters:
          background: {type: color, format: hex, value: "#E2E6EC"}
      selected-hover:
        sourceRefs: [hover-decision, implementation]
        parameters:
          background: {type: color, format: hex, value: "#E2E6EC"}
  collapsed:
    description: Тот же пункт без видимого текста; не историческая кнопка32 с glyph16
    sourceRefs: [panel-decision, anchor-evidence]
    parameters:
      hit-width: {type: dimension, value: 48, unit: px}
      hit-height: {type: dimension, value: 36, unit: px}
      hover-circle-size: {type: dimension, value: 32, unit: px}
      text-visible: {type: boolean, value: false}
      text-aria-hidden: {type: boolean, value: true}
      persistent-selected-background: {type: boolean, value: false}
    states:
      hover:
        sourceRefs: [implementation]
        parameters:
          hover-circle-color: {type: color, format: hex, value: "#E2E6EC"}
dependencies:
  - id: panel-configuration
    document: "specs/Общие компоненты/Боковая навигация/Контракт.md"
